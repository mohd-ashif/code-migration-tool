name: Backend CI/CD Pipeline (Render)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Build Check
        run: npm run build

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests

  deploy-render:
    name: Deploy Backend to Render
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository settings."
            echo "Please add RENDER_DEPLOY_HOOK_URL to GitHub Secrets under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Triggering Render Production Deployment..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment triggered successfully."
